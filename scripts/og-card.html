<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Teko:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse at 50% 0%, #2a3314 0%, #0c0d0a 58%),
          #0c0d0a;
        color: #f3f0e4;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 47px,
          rgb(214 255 47 / 0.04) 47px 48px
        );
        pointer-events: none;
      }
      .rule {
        position: absolute;
        left: 48px;
        right: 48px;
        height: 2px;
        background: #d6ff2f;
      }
      .rule.top {
        top: 28px;
      }
      .rule.bot {
        bottom: 28px;
      }
      .sheet {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 48px;
        bottom: 48px;
        background: #efe6cf;
        color: #14120c;
        border: 2px solid #d6ff2f;
        box-sizing: border-box;
        padding: 28px 40px 24px;
        display: flex;
        flex-direction: column;
      }
      .kicker {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6d6b5e;
      }
      .kicker b {
        color: #14120c;
        font-weight: 600;
      }
      h1 {
        margin: 10px 0 0;
        font-family: Teko, "Arial Narrow", sans-serif;
        font-size: 72px;
        line-height: 0.82;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
      }
      h1 em {
        font-style: normal;
      }
      table {
        width: 100%;
        margin-top: 18px;
        border-collapse: collapse;
        flex: 1;
      }
      th {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6d6b5e;
        font-weight: 500;
        text-align: left;
        padding: 0 0 8px;
        border-bottom: 2px solid #14120c;
      }
      th.pts,
      td.pts {
        text-align: right;
      }
      td {
        border-bottom: 1px solid rgb(20 18 12 / 0.16);
        padding: 4px 0 2px;
        vertical-align: end;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .abbr {
        font-family: Teko, "Arial Narrow", sans-serif;
        font-size: 64px;
        line-height: 0.82;
        font-weight: 600;
        letter-spacing: 0.02em;
        width: 140px;
      }
      .map {
        font-family: Teko, "Arial Narrow", sans-serif;
        font-size: 42px;
        line-height: 0.9;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .pts {
        font-family: Teko, "Arial Narrow", sans-serif;
        font-size: 64px;
        line-height: 0.82;
        font-weight: 600;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 2px solid #d6ff2f;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6d6b5e;
      }
      .foot strong {
        color: #14120c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule top"></div>
      <div class="sheet">
        <div class="kicker">
          <span><b>XUIDECK</b> Fantasy</span>
          <span>Week 33 · Start five</span>
        </div>
        <h1>Scoring<em>.</em></h1>
        <table>
          <thead>
            <tr>
              <th>Stat</th>
              <th>Counts as</th>
              <th class="pts">Pts</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="abbr">R</td>
              <td class="map">Likes</td>
              <td class="pts">1</td>
            </tr>
            <tr>
              <td class="abbr">H</td>
              <td class="map">Impressions / 1k</td>
              <td class="pts">1</td>
            </tr>
            <tr>
              <td class="abbr">HR</td>
              <td class="map">Posts over 100k</td>
              <td class="pts">10</td>
            </tr>
            <tr>
              <td class="abbr">RBI</td>
              <td class="map">Replies + quotes</td>
              <td class="pts">2</td>
            </tr>
            <tr>
              <td class="abbr">SB</td>
              <td class="map">Bookmarks</td>
              <td class="pts">3</td>
            </tr>
          </tbody>
        </table>
        <p class="foot">
          <span>Draft any account on X</span>
          <span><strong>Then a log handicap</strong></span>
        </p>
      </div>
      <div class="rule bot"></div>
    </div>
  </body>
</html>
