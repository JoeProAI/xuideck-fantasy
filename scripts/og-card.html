<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Teko:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse at 50% 0%, #2a3314 0%, #0c0d0a 58%),
          #0c0d0a;
        color: #f3f0e4;
        font-family: Teko, "Arial Narrow", sans-serif;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 47px,
          rgb(214 255 47 / 0.04) 47px 48px
        );
        pointer-events: none;
      }
      .rule {
        position: absolute;
        left: 48px;
        right: 48px;
        height: 2px;
        background: #d6ff2f;
      }
      .rule.top {
        top: 28px;
      }
      .rule.bot {
        bottom: 28px;
      }
      .topbar {
        position: absolute;
        top: 42px;
        left: 56px;
        right: 56px;
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a9788;
      }
      .topbar b {
        color: #d6ff2f;
        font-weight: 600;
      }
      h1 {
        position: absolute;
        top: 84px;
        left: 64px;
        right: 64px;
        margin: 0;
        text-align: center;
        font-size: 96px;
        line-height: 0.82;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-weight: 600;
      }
      h1 em {
        display: block;
        font-style: normal;
        color: #d6ff2f;
        font-size: 82px;
        letter-spacing: 0.08em;
      }
      .lineup {
        position: absolute;
        left: 48px;
        right: 48px;
        top: 278px;
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }
      .stat {
        flex: 1;
        background: #efe6cf;
        color: #14120c;
        border: 2px solid #d6ff2f;
        padding: 16px 12px 18px;
        min-height: 214px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      .stat .abbr {
        font-size: 92px;
        line-height: 0.78;
        letter-spacing: 0.02em;
        font-weight: 600;
      }
      .stat .map {
        margin-top: auto;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6d6b5e;
      }
      .stat .base {
        margin-top: 4px;
        font-size: 28px;
        line-height: 0.85;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .tag {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 42px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8c4b4;
      }
      .tag strong {
        color: #d6ff2f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule top"></div>
      <div class="topbar">
        <span>Weekly fantasy. The players are X accounts.</span>
        <span><b>XUIDECK</b> · Week 33</span>
      </div>
      <h1>Draft any<em>account on X</em></h1>
      <div class="lineup">
        <div class="stat">
          <div class="abbr">R</div>
          <div class="map">Likes</div>
          <div class="base">Runs</div>
        </div>
        <div class="stat">
          <div class="abbr">H</div>
          <div class="map">Impressions / 1k</div>
          <div class="base">Hits</div>
        </div>
        <div class="stat">
          <div class="abbr">HR</div>
          <div class="map">Posts over 100k</div>
          <div class="base">Homers</div>
        </div>
        <div class="stat">
          <div class="abbr">RBI</div>
          <div class="map">Replies + quotes</div>
          <div class="base">RBI</div>
        </div>
        <div class="stat">
          <div class="abbr">SB</div>
          <div class="map">Bookmarks</div>
          <div class="base">Steals</div>
        </div>
      </div>
      <p class="tag">
        <span><strong>Likes</strong> are runs</span>
        <span><strong>100k</strong> posts are home runs</span>
        <span>Start five. Win the week.</span>
      </p>
      <div class="rule bot"></div>
    </div>
  </body>
</html>
