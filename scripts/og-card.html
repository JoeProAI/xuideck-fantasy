<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Teko:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse at 50% 0%, #2a3314 0%, #0c0d0a 58%),
          #0c0d0a;
        color: #f3f0e4;
        font-family: Teko, "Arial Narrow", sans-serif;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 47px,
          rgb(214 255 47 / 0.04) 47px 48px
        );
        pointer-events: none;
      }
      .rule {
        position: absolute;
        left: 48px;
        right: 48px;
        height: 2px;
        background: #d6ff2f;
      }
      .rule.top {
        top: 28px;
      }
      .rule.bot {
        bottom: 28px;
      }
      .topbar {
        position: absolute;
        top: 42px;
        left: 56px;
        right: 56px;
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a9788;
      }
      .topbar b {
        color: #d6ff2f;
        font-weight: 600;
      }
      h1 {
        position: absolute;
        top: 78px;
        left: 56px;
        right: 56px;
        margin: 0;
        text-align: center;
        font-size: 92px;
        line-height: 0.82;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-weight: 600;
      }
      h1 em {
        display: block;
        font-style: normal;
        color: #d6ff2f;
        font-size: 78px;
        letter-spacing: 0.08em;
      }
      .lineup {
        position: absolute;
        left: 48px;
        right: 48px;
        top: 268px;
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }
      .player {
        flex: 1;
        background: #efe6cf;
        color: #14120c;
        overflow: hidden;
        border: 2px solid #d6ff2f;
      }
      .player img {
        display: block;
        width: 100%;
        height: 168px;
        object-fit: cover;
        object-position: center 18%;
        background: #1c1f14;
      }
      .player .meta {
        padding: 8px 8px 10px;
      }
      .player .name {
        font-size: 28px;
        line-height: 0.85;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .player .handle {
        margin-top: 4px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #6d6b5e;
      }
      .tag {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 42px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8c4b4;
      }
      .tag strong {
        color: #d6ff2f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule top"></div>
      <div class="topbar">
        <span>Yahoo fantasy. The players are X accounts.</span>
        <span><b>XUIDECK</b> · Week 33</span>
      </div>
      <h1>Draft any<em>account on X</em></h1>
      <div class="lineup">
        <div class="player">
          <img src="../public/players/elonmusk.jpg" alt="" />
          <div class="meta">
            <div class="name">Elon</div>
            <div class="handle">@elonmusk</div>
          </div>
        </div>
        <div class="player">
          <img src="../public/players/grok.jpg" alt="" />
          <div class="meta">
            <div class="name">Grok</div>
            <div class="handle">@grok</div>
          </div>
        </div>
        <div class="player">
          <img src="../public/players/nikitabier.jpg" alt="" />
          <div class="meta">
            <div class="name">Nikita</div>
            <div class="handle">@nikitabier</div>
          </div>
        </div>
        <div class="player">
          <img src="../public/players/cb_doge.jpg" alt="" />
          <div class="meta">
            <div class="name">Doge</div>
            <div class="handle">@cb_doge</div>
          </div>
        </div>
        <div class="player">
          <img src="../public/players/XOpenSource.jpg" alt="" />
          <div class="meta">
            <div class="name">Open Src</div>
            <div class="handle">@XOpenSource</div>
          </div>
        </div>
      </div>
      <p class="tag">
        <span><strong>Likes</strong> are runs</span>
        <span><strong>100k</strong> posts are home runs</span>
        <span>Start five. Win the week.</span>
      </p>
      <div class="rule bot"></div>
    </div>
  </body>
</html>
