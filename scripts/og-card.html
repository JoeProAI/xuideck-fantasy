<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Teko:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse at 50% 18%, #32400f 0%, #0c0d0a 62%),
          #0c0d0a;
        color: #f3f0e4;
        font-family: Teko, "Arial Narrow", sans-serif;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 47px,
          rgb(214 255 47 / 0.045) 47px 48px
        );
        pointer-events: none;
      }
      .rule {
        position: absolute;
        left: 48px;
        right: 48px;
        height: 2px;
        background: #d6ff2f;
      }
      .rule.top {
        top: 28px;
      }
      .rule.bot {
        bottom: 28px;
      }
      .topbar {
        position: absolute;
        top: 42px;
        left: 56px;
        right: 56px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a9788;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #d6ff2f;
        color: #111408;
        font-weight: 600;
        letter-spacing: 0.18em;
        padding: 6px 12px 5px;
      }
      .live i {
        width: 8px;
        height: 8px;
        background: #111408;
        border-radius: 50%;
        display: block;
      }
      .gate {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 96px;
        display: grid;
        grid-template-columns: 1fr 96px 1fr;
        align-items: center;
        gap: 16px;
      }
      .side .who {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #9a9788;
      }
      .side .n {
        margin-top: 2px;
        font-size: 168px;
        line-height: 0.76;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .side.you .n {
        color: #d6ff2f;
      }
      .side.them {
        text-align: right;
      }
      .side .sub {
        margin-top: 4px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c8c4b4;
      }
      .side.you .sub {
        color: #d6ff2f;
      }
      .vs {
        width: 96px;
        height: 96px;
        background: #d6ff2f;
        color: #111408;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 0.04em;
        box-shadow: 0 0 0 3px #111408, 0 0 40px rgb(214 255 47 / 0.35);
      }
      .slots {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 360px;
        display: flex;
        gap: 14px;
      }
      .slot {
        flex: 1;
        background: #efe6cf;
        color: #14120c;
        border: 2px solid #d6ff2f;
        height: 168px;
        box-sizing: border-box;
        padding: 12px 12px 14px;
        display: flex;
        flex-direction: column;
      }
      .slot .num {
        font-size: 56px;
        line-height: 0.78;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .slot .at {
        margin-top: auto;
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.08em;
        color: #6d6b5e;
      }
      .slot .open {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #14120c;
      }
      .tag {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 42px;
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8c4b4;
      }
      .tag strong {
        color: #d6ff2f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule top"></div>
      <div class="topbar">
        <span class="live"><i></i>Live</span>
        <span>XUIDECK FANTASY · Week 33</span>
      </div>
      <div class="gate">
        <div class="side you">
          <div class="who">A 6k account</div>
          <div class="n">6k</div>
          <div class="sub">Winning</div>
        </div>
        <div class="vs">VS</div>
        <div class="side them">
          <div class="who">20 million followers</div>
          <div class="n">20M</div>
          <div class="sub">The field</div>
        </div>
      </div>
      <div class="slots">
        <div class="slot"><div class="num">01</div><div class="at">@</div><div class="open">Open</div></div>
        <div class="slot"><div class="num">02</div><div class="at">@</div><div class="open">Open</div></div>
        <div class="slot"><div class="num">03</div><div class="at">@</div><div class="open">Open</div></div>
        <div class="slot"><div class="num">04</div><div class="at">@</div><div class="open">Open</div></div>
        <div class="slot"><div class="num">05</div><div class="at">@</div><div class="open">Open</div></div>
      </div>
      <p class="tag">
        <span><strong>Likes</strong> are runs</span>
        <span><strong>100k</strong> posts are home runs</span>
        <span>Start five. Draft anyone.</span>
      </p>
      <div class="rule bot"></div>
    </div>
  </body>
</html>
